name = "cf-2fa-vault"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "cf-2fa-vault-db"
database_id = "9a97cbb3-5bfa-4e0c-a814-eace41a27ad7"

# 在 Cloudflare Dashboard -> Workers & Pages -> cf-2fa-vault -> Settings -> Variables and Secrets 中配置：
#   AUTH_USERNAME  (必填) 登录用户名，如 admin
#   AUTH_PASSWORD  (必填) 登录密码（建议使用 Secret 加密存储）
#   ENCRYPTION_KEY (推荐) 32字节 Base64 密钥，用于 D1 落盘 AES-256-GCM 加密；修改登录密码不影响已有数据
