name = "2fa-cfworker"
main = "src/worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "cf-2fa-vault-db"
database_id = "093b4a59-ae0c-49fe-894d-12a9374c3e87"

# 在 Cloudflare Dashboard -> Workers & Pages -> 2fa-cfworker -> Settings -> Variables and Secrets 中配置：
#   AUTH_USERNAME   (必填) 登录用户名，如 admin
#   AUTH_PASSWORD   (必填) 登录密码（建议使用 Secret 加密存储）
#   ENCRYPTION_KEY  (推荐) 高熵随机密钥，用于 D1 落盘 AES-256-GCM 加密；修改登录密码不影响已有数据
#   ALLOWED_ORIGINS (可选) 当使用 EdgeOne / CDN CNAME 反代回源时填写允许的前端域名（逗号分隔，支持如 2fa.example.com, *.example.com）
